name: CI

# Validates the design harness, the evidence-record format, and the freshness
# of every committed derived artifact on each PR and each push to `main`
# (T1 checklist item 10, issue #28). Four jobs run here:
#
#   harness                    -- `npm run check:ci`: the pure-Python unit
#                                 tests under sim/lib/ (the extraction and
#                                 campaign math the ngspice testbenches feed)
#                                 plus the Loom guard-hook tests
#                                 (`npm run test:guards`).
#   evidence-record format     -- scripts/ci/check-evidence-format.sh: repo
#                                 hygiene (per-directory READMEs, no raw
#                                 simulation artifacts, resolvable markdown
#                                 links) and freshness of the derived
#                                 evidence rollups under sim/ and
#                                 measurements/.
#   klt signoff                -- re-grades the T1 block manifest with the
#                                 pinned grading klt and requires the
#                                 committed signoff report to match.
#   generated array schematics -- regenerates the array schematics and
#                                 requires the committed copies to match.
#
# The evidence-format check runs in `evidence-format` ONLY, so it is visible
# as its own named status check. It is deliberately NOT also invoked from
# `npm run check:ci`: that second leg ran the repo's heaviest check twice per
# PR for no extra signal and was removed in #332. `npm run lint` remains the
# local entry point for the same check -- please do not re-add it to
# `check:ci`.
#
# The ngspice testbenches themselves are not run here: they need the pinned
# gf180mcu PDK, which CI does not install. See sim/README.md for the
# cold-start invocation.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  harness:
    name: harness (npm run check:ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Run harness checks (Python unit tests + Loom guard tests)
        run: npm run check:ci

  evidence-format:
    name: evidence-record format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not floating "3.x": klayout wheels lag new CPython releases
      # (none for cp315), so a floating pin falls back to a source build that
      # fails. Keep both jobs on the same version.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate sim/ layout/ measurements/ evidence-record format
        run: ./scripts/ci/check-evidence-format.sh

  signoff:
    name: klt signoff (T1 tier-verdict freshness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not floating "3.x": klayout wheels lag new CPython releases
      # (none for cp315), so a floating pin falls back to a source build that
      # fails. Keep both jobs on the same version.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep this pin in sync with signoff/regenerate.sh's KLT_VERSION. The
      # released registry wheel carries the git tag identity the freshness
      # check asserts; same-version snapshots can grade differently.
      - name: Install the pinned grading klt (klayout-tools)
        run: pip install klayout-tools==0.8.0

      - name: Show the grading klt version (expect klt 0.8.0)
        run: klt --version

      - name: Re-grade the block manifest; require the committed report to match
        run: ./scripts/ci/check-signoff-freshness.sh

  array-schematics:
    name: generated array schematics (drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate array schematics; require the committed copies to match
        run: ./scripts/ci/check-array-schematics.sh
