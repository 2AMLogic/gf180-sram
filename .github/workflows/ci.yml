name: CI

# Validates the design harness and the evidence-record format on every PR
# (T1 checklist item 10, issue #28). This is intentionally thin scaffolding:
# no design sources or testbenches have landed yet (#21, #24), so today the
# `harness` job runs whatever the project's standard `npm run lint` / `npm
# run test` entry points do (currently a structural evidence-format check
# and a stub, respectively), and `evidence-format` runs the same lint
# directly so it is visible as its own status check. Both jobs are meant to
# grow real content as the design/testbench issues land, per the issue's
# "Notes" section — they are not meant to invent the eventual evidence
# grammar themselves.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  harness:
    name: harness (npm run check:ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Run harness checks (lint + testbenches)
        run: npm run check:ci

  evidence-format:
    name: evidence-record format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not floating "3.x": klayout wheels lag new CPython releases
      # (none for cp315), so a floating pin falls back to a source build that
      # fails. Keep both jobs on the same version.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate sim/ layout/ measurements/ evidence-record format
        run: ./scripts/ci/check-evidence-format.sh

  signoff:
    name: klt signoff (T1 tier-verdict freshness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not floating "3.x": klayout wheels lag new CPython releases
      # (none for cp315), so a floating pin falls back to a source build that
      # fails. Keep both jobs on the same version.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep this pin in sync with signoff/regenerate.sh's KLT_VERSION. The
      # released registry wheel carries the git tag identity the freshness
      # check asserts; same-version snapshots can grade differently.
      - name: Install the pinned grading klt (klayout-tools)
        run: pip install klayout-tools==0.8.0

      - name: Show the grading klt version (expect klt 0.8.0)
        run: klt --version

      - name: Re-grade the block manifest; require the committed report to match
        run: ./scripts/ci/check-signoff-freshness.sh

  provenance-hygiene:
    name: provenance hygiene (no new host paths in committed reports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not floating "3.x": klayout wheels lag new CPython releases
      # (none for cp315), so a floating pin falls back to a source build that
      # fails. Keep both jobs on the same version.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same pin as the `signoff` job above -- `klt env-provenance scan` has
      # shipped since 0.8.0, so no second version is in play here.
      - name: Install the pinned klt (klayout-tools)
        run: pip install klayout-tools==0.8.0

      # The mint-time half of the same rule: layout/reports/commit_report.py
      # is the single path by which generate.sh writes a report. Run here
      # rather than under `npm run test` because three of its cases need klt,
      # and a skipped case must not look like a passing one.
      - name: Test the report scrub/lint helper
        run: python3 layout/reports/test_commit_report.py

      # The guard is only worth a status check if it can go red: this asserts
      # on synthetic fixtures that a new leak fails, a baselined one passes,
      # and a stale baseline entry fails (issue #340).
      - name: Assert the guard can fail (self-test)
        run: ./scripts/ci/check-provenance-hygiene.sh --self-test

      - name: Scan committed layout/ and views/ reports for host-path leaks
        run: ./scripts/ci/check-provenance-hygiene.sh

  array-schematics:
    name: generated array schematics (drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate array schematics; require the committed copies to match
        run: ./scripts/ci/check-array-schematics.sh
