name: CI

# Validates the design harness, the evidence-record format, and the freshness
# of every committed derived artifact on each PR and each push to `main`
# (T1 checklist item 10, issue #28). Six jobs run here:
#
#   harness                    -- `npm run check:ci`: the pure-Python unit
#                                 tests under sim/lib/ (the extraction and
#                                 campaign math the ngspice testbenches feed)
#                                 plus the Loom guard-hook tests
#                                 (`npm run test:guards`).
#   evidence-record format     -- scripts/ci/check-evidence-format.sh: repo
#                                 hygiene (per-directory READMEs, no raw
#                                 simulation artifacts, resolvable markdown
#                                 links) and freshness of the derived
#                                 evidence rollups under sim/ and
#                                 measurements/.
#   klt signoff                -- re-grades the T1 block manifest with the
#                                 pinned grading klt and requires the
#                                 committed signoff report to match.
#   provenance hygiene         -- tests the layout/reports commit-report
#                                 scrub/lint helper, self-tests
#                                 scripts/ci/check-provenance-hygiene.sh,
#                                 and scans committed layout/ and views/
#                                 reports for host-path leaks (#340).
#   generated array schematics -- regenerates the array schematics and
#                                 requires the committed copies to match.
#   repo hygiene               -- scripts/ci/check-repo-hygiene.sh: the
#                                 tracked-tree gate (size cap, binary
#                                 allowlist, venv shape) plus per-rule
#                                 fixture self-tests.
#
# The evidence-format check runs in `evidence-format` ONLY, so it is visible
# as its own named status check. It is deliberately NOT also invoked from
# `npm run check:ci`: that second leg ran the repo's heaviest check twice per
# PR for no extra signal and was removed in #332. `npm run lint` remains the
# local entry point for the same check -- please do not re-add it to
# `check:ci`.
#
# The ngspice testbenches themselves are not run here: they need the pinned
# gf180mcu PDK, which CI does not install. See sim/README.md for the
# cold-start invocation.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  harness:
    name: harness (npm run check:ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Run harness checks (Python unit tests + Loom guard tests)
        run: npm run check:ci

  evidence-format:
    name: evidence-record format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not floating "3.x": klayout wheels lag new CPython releases
      # (none for cp315), so a floating pin falls back to a source build that
      # fails. Keep both jobs on the same version.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate sim/ layout/ measurements/ evidence-record format
        run: ./scripts/ci/check-evidence-format.sh

  signoff:
    name: klt signoff (T1 tier-verdict freshness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not floating "3.x": klayout wheels lag new CPython releases
      # (none for cp315), so a floating pin falls back to a source build that
      # fails. Keep both jobs on the same version.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep this pin in sync with signoff/regenerate.sh's KLT_VERSION. The
      # released registry wheel carries the git tag identity the freshness
      # check asserts; same-version snapshots can grade differently.
      - name: Install the pinned grading klt (klayout-tools)
        run: pip install klayout-tools==0.8.0

      - name: Show the grading klt version (expect klt 0.8.0)
        run: klt --version

      - name: Re-grade the block manifest; require the committed report to match
        run: ./scripts/ci/check-signoff-freshness.sh

  provenance-hygiene:
    name: provenance hygiene (no new host paths in committed reports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not floating "3.x": klayout wheels lag new CPython releases
      # (none for cp315), so a floating pin falls back to a source build that
      # fails. Keep both jobs on the same version.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same pin as the `signoff` job above -- `klt env-provenance scan` has
      # shipped since 0.8.0, so no second version is in play here.
      - name: Install the pinned klt (klayout-tools)
        run: pip install klayout-tools==0.8.0

      # The mint-time half of the same rule: layout/reports/commit_report.py
      # is the single path by which generate.sh writes a report. Run here
      # rather than under `npm run test` because three of its cases need klt,
      # and a skipped case must not look like a passing one.
      - name: Test the report scrub/lint helper
        run: python3 layout/reports/test_commit_report.py

      # The guard is only worth a status check if it can go red: this asserts
      # on synthetic fixtures that a new leak fails, a baselined one passes,
      # and a stale baseline entry fails (issue #340).
      - name: Assert the guard can fail (self-test)
        run: ./scripts/ci/check-provenance-hygiene.sh --self-test

      - name: Scan committed layout/ and views/ reports for host-path leaks
        run: ./scripts/ci/check-provenance-hygiene.sh

  array-schematics:
    name: generated array schematics (drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate array schematics; require the committed copies to match
        run: ./scripts/ci/check-array-schematics.sh

  # Hygiene gate (issue #361): every job above checks that tracked content
  # is *well formed*; this one bounds what may be tracked at all (blob
  # size, binary type, venv-shaped paths). Pure git+bash over the
  # checked-out tree — no language or PDK setup needed, and the default
  # shallow checkout carries HEAD's full tree.
  repo-hygiene:
    name: repo hygiene (tracked-tree gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tracked tree (size cap / binary allowlist / venv shape)
        run: ./scripts/ci/check-repo-hygiene.sh

      - name: Gate self-tests (per-rule fixture repos)
        run: ./scripts/ci/tests/test-check-repo-hygiene.sh
